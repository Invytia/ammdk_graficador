<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graficador AMMDK | Sistema de Gestión de Torneos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* PALETA DE COLORES AMMDK */
        :root {
            --ammdk-blue: #002349;       /* Azul Institucional */
            --ammdk-blue-light: #003a7a;
            --ammdk-gold: #c5a059;       /* Dorado de gala */
            --ammdk-gold-light: #e0c28d;
            --ammdk-white: #ffffff;
            --ammdk-gray: #f4f4f4;
            --ammdk-dark: #1a1a1a;
            
            /* Status */
            --status-green: #2ecc71;
            --status-yellow: #f1c40f;
            --status-red: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: var(--ammdk-gray); 
            color: var(--ammdk-dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background-color: var(--ammdk-blue);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .sidebar-header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            color: var(--ammdk-gold);
            letter-spacing: 1px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 10px;
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 8px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            background: transparent;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--ammdk-gold);
            color: var(--ammdk-blue);
            font-weight: 700;
        }

        /* MAIN CONTENT */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: #fff;
        }

        header.top-bar {
            padding: 20px 40px;
            background: var(--ammdk-white);
            border-bottom: 2px solid var(--ammdk-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            color: var(--ammdk-blue);
        }

        .search-box input {
            padding: 10px 20px;
            border: 1px solid #ddd;
            border-radius: 20px;
            width: 300px;
            outline: none;
        }

        .content-padding {
            padding: 30px 40px;
        }

        /* KPI CARDS */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .kpi-card {
            background: var(--ammdk-blue);
            color: white;
            padding: 25px;
            border-radius: 8px;
            border-bottom: 4px solid var(--ammdk-gold);
            text-align: center;
        }

        .kpi-card h3 { font-size: 0.8rem; text-transform: uppercase; color: var(--ammdk-gold-light); opacity: 0.9; }
        .kpi-card .value { font-size: 2.5rem; font-weight: 700; margin-top: 10px; }

        /* AREAS GRID */
        .areas-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .area-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .area-card:hover { transform: translateY(-5px); border-color: var(--ammdk-gold); }

        .area-card h4 { color: var(--ammdk-blue); border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        
        .status-pill {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
        }

        .bg-verde { background-color: var(--status-green); }
        .bg-amarillo { background-color: var(--status-yellow); color: #333; }
        .bg-rojo { background-color: var(--status-red); }

        /* DRAWER */
        .drawer {
            position: fixed;
            right: -450px;
            top: 0;
            width: 450px;
            height: 100%;
            background: white;
            box-shadow: -5px 0 20px rgba(0,0,0,0.2);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            padding: 30px;
        }

        .drawer.open { right: 0; }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 35, 73, 0.6);
            z-index: 90;
        }

        .overlay.active { display: block; }

        .close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--ammdk-blue);
            float: right;
        }

        /* TABLES */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
        th { background: var(--ammdk-blue); color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background-color: #f9f9f9; }

        /* ALERT CARDS */
        .alert-card {
            padding: 15px;
            border-left: 5px solid var(--status-red);
            background: #fff5f5;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>AMMDK</h2>
            <p style="font-size: 0.7rem; opacity: 0.8;">ASOCIACIÓN MEXICANA MDK</p>
        </div>
        <nav class="sidebar-nav">
            <button class="nav-item active" onclick="showView('dashboard')">Panel General</button>
            <button class="nav-item" onclick="showView('areas')">Áreas de Competencia</button>
            <button class="nav-item" onclick="showView('graficas')">Listado de Gráficas</button>
            <button class="nav-item" onclick="showView('alertas')">Validación y Conflictos</button>
        </nav>
        <div style="padding: 20px; font-size: 0.7rem; opacity: 0.5; text-align: center;">
            © 2026 AMMDK - Gestión Operativa
        </div>
    </aside>

    <div class="main-container">
        <header class="top-bar">
            <h1 id="page-title">Panel General</h1>
            <div class="search-box">
                <input type="text" placeholder="Buscar por nombre de alumno..." onkeyup="searchAlumno(this.value)">
            </div>
        </header>

        <div id="main-content" class="content-padding">
            </div>
    </div>

    <div id="overlay" class="overlay" onclick="closeDrawer()"></div>
    <div id="drawer" class="drawer">
        <button class="close-btn" onclick="closeDrawer()">&times;</button>
        <div id="drawer-content"></div>
    </div>

    <script src="assets/js/mockData.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/areas.js"></script>
    <script src="assets/js/graficas.js"></script>
    <script src="assets/js/validacion.js"></script>
    <script src="assets/js/alumnos.js"></script>

    <script>
        // Inicialización rápida si no se cargan archivos externos de inmediato
        window.onload = () => {
            if (typeof App !== 'undefined') {
                App.init();
            } else {
                console.error("Los módulos JS no se encontraron. Asegúrate de que la carpeta assets/js/ tenga los archivos.");
                // Fallback manual para demo si los archivos no existen aún
                document.getElementById('main-content').innerHTML = `
                    <div style="text-align:center; padding-top: 50px;">
                        <h3>Bienvenido al Graficador AMMDK</h3>
                        <p>Por favor, asegúrate de crear los archivos JS en la carpeta assets/js para activar la funcionalidad.</p>
                    </div>
                `;
            }
        };

        function showView(view) {
            // Lógica para cambiar vista
            const btns = document.querySelectorAll('.nav-item');
            btns.forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            if (typeof App !== 'undefined') App.renderView(view);
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }

        function searchAlumno(val) {
            if (typeof Alumnos !== 'undefined') Alumnos.buscar(val);
        }
    </script>
</body>
</html>
