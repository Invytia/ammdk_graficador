<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graficador AMMDK | Sistema de Gestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* PALETA MDK OFICIAL (Basada en ammdk.org) */
        :root {
            --mdk-green: #006837;       /* Verde institucional MDK */
            --mdk-green-light: #009245;
            --mdk-yellow: #f9ed32;      /* Amarillo brillante MDK */
            --mdk-black: #1a1a1a;
            --mdk-white: #ffffff;
            --mdk-gray: #f2f2f2;
            
            /* Status */
            --status-ok: #27ae60;
            --status-warn: #f39c12;
            --status-danger: #c0392b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Open Sans', sans-serif; 
            background-color: var(--mdk-gray); 
            color: var(--mdk-black);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR ESTILO MDK */
        .sidebar {
            width: 280px;
            background-color: var(--mdk-black);
            color: white;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 30px 20px;
            text-align: center;
            background-color: var(--mdk-white); /* Fondo blanco para el logo */
            border-bottom: 5px solid var(--mdk-green);
        }

        .sidebar-header img {
            max-width: 120px;
            height: auto;
            margin-bottom: 10px;
        }

        .sidebar-header h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            color: var(--mdk-green);
            font-weight: 700;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 10px;
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 5px;
            color: #ccc;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            background: transparent;
            text-align: left;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            color: var(--mdk-white);
            background-color: rgba(255,255,255,0.05);
        }

        .nav-item.active {
            background-color: var(--mdk-green);
            color: var(--mdk-yellow); /* Texto amarillo sobre verde */
        }

        /* MAIN CONTENT */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        header.top-bar {
            padding: 15px 40px;
            background: var(--mdk-white);
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            color: var(--mdk-green);
            text-transform: uppercase;
        }

        .search-box input {
            padding: 10px 20px;
            border: 2px solid var(--mdk-green);
            border-radius: 4px;
            width: 300px;
            outline: none;
        }

        .content-padding { padding: 30px 40px; }

        /* KPI CARDS (Verde con acento amarillo) */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .kpi-card {
            background: var(--mdk-white);
            padding: 20px;
            border-radius: 2px;
            border-top: 5px solid var(--mdk-green);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: left;
        }

        .kpi-card h3 { font-size: 0.75rem; text-transform: uppercase; color: #666; }
        .kpi-card .value { font-size: 2.2rem; font-weight: 700; color: var(--mdk-green); margin-top: 5px; }

        /* AREAS GRID */
        .areas-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .area-card {
            background: var(--mdk-white);
            border: 1px solid #ddd;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 8px solid var(--mdk-gray);
        }

        .area-card:hover { border-color: var(--mdk-green); background-color: #fafafa; }
        
        .area-card.status-verde { border-left-color: var(--status-ok); }
        .area-card.status-amarillo { border-left-color: var(--status-warn); }
        .area-card.status-rojo { border-left-color: var(--status-danger); }

        .area-card h4 { color: var(--mdk-green); margin-bottom: 5px; font-family: 'Montserrat'; }

        /* DRAWER & OVERLAY */
        .drawer {
            position: fixed;
            right: -450px;
            top: 0;
            width: 450px;
            height: 100%;
            background: white;
            box-shadow: -10px 0 30px rgba(0,0,0,0.2);
            transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: 100;
            padding: 40px;
        }

        .drawer.open { right: 0; }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 104, 55, 0.3); /* Verde MDK con transparencia */
            backdrop-filter: blur(2px);
            z-index: 90;
        }

        .overlay.active { display: block; }

        /* TABLAS ESTILO PROFESIONAL */
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: var(--mdk-green); color: var(--mdk-yellow); padding: 15px; text-align: left; font-family: 'Montserrat'; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        tr:hover { background-color: #f9fff9; }

        /* ALERT CARDS */
        .alert-card {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            background: white;
            border: 1px solid #eee;
            border-left-width: 6px;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="assets/logo.jpg" alt="MDK Logo" onerror="this.style.display='none'">
            <h2>AMMDK</h2>
            <p style="font-size: 0.6rem; color: #666; font-weight: bold;">ASOCIACIÓN MEXICANA MDK</p>
        </div>
        <nav class="sidebar-nav">
            <button class="nav-item active" onclick="showView('dashboard')">RESUMEN GENERAL</button>
            <button class="nav-item" onclick="showView('areas')">ÁREAS DE TORNEO</button>
            <button class="nav-item" onclick="showView('graficas')">LISTADO DE GRÁFICAS</button>
            <button class="nav-item" onclick="showView('alertas')">CONFLICTOS Y ALERTAS</button>
        </nav>
        <div style="padding: 20px; font-size: 0.65rem; color: #555; text-align: center; border-top: 1px solid #333;">
            SISTEMA DE GRAFICACIÓN V1.0
        </div>
    </aside>

    <div class="main-container">
        <header class="top-bar">
            <h1 id="page-title">Resumen General</h1>
            <div class="search-box">
                <input type="text" placeholder="🔍 Buscar alumno por nombre..." onkeyup="searchAlumno(this.value)">
            </div>
        </header>

        <div id="main-content" class="content-padding">
            </div>
    </div>

    <div id="overlay" class="overlay" onclick="closeDrawer()"></div>
    <div id="drawer" class="drawer">
        <button onclick="closeDrawer()" style="float:right; border:none; background:none; font-size:2rem; cursor:pointer; color:var(--mdk-green)">&times;</button>
        <div id="drawer-content"></div>
    </div>

    <script src="assets/js/mockData.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/areas.js"></script>
    <script src="assets/js/graficas.js"></script>
    <script src="assets/js/validacion.js"></script>
    <script src="assets/js/alumnos.js"></script>

    <script>
        window.onload = () => {
            if (typeof App !== 'undefined') App.init();
        };

        function showView(view) {
            const btns = document.querySelectorAll('.nav-item');
            btns.forEach(b => b.classList.remove('active'));
            if(event) event.target.classList.add('active');
            
            if (typeof App !== 'undefined') App.renderView(view);
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }

        function searchAlumno(val) {
            if (typeof Alumnos !== 'undefined') Alumnos.buscar(val);
        }
    </script>
</body>
</html>
