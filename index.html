<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graficador AMMDK | Panel Operativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* PALETA MDK OFICIAL */
        :root {
            --mdk-green: #006837;
            --mdk-yellow: #f9ed32;
            --mdk-black: #1a1a1a;
            --mdk-white: #ffffff;
            --mdk-gray: #f2f2f2;
            
            /* Status */
            --status-ok: #27ae60;
            --status-warn: #f39c12;
            --status-danger: #c0392b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Open Sans', sans-serif; 
            background-color: var(--mdk-gray); 
            color: var(--mdk-black);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background-color: var(--mdk-black);
            color: white;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 30px 20px;
            text-align: center;
            background-color: var(--mdk-white); 
            border-bottom: 5px solid var(--mdk-green);
        }

        .sidebar-header img {
            max-width: 160px;
            height: auto;
            display: block;
            margin: 0 auto 10px auto;
        }

        .sidebar-header h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            color: var(--mdk-green);
            font-weight: 700;
            margin-top: 5px;
        }

        .sidebar-header p {
            font-size: 0.6rem;
            color: #666;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar-nav { flex: 1; padding: 20px 10px; }

        .nav-item {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 5px;
            color: #ccc;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            background: transparent;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .nav-item:hover { color: var(--mdk-white); background-color: rgba(255,255,255,0.05); }
        .nav-item.active { background-color: var(--mdk-green); color: var(--mdk-yellow); }

        /* MAIN CONTENT */
        .main-container { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }

        header.top-bar {
            padding: 15px 40px;
            background: var(--mdk-white);
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            color: var(--mdk-green);
            text-transform: uppercase;
        }

        .search-box input {
            padding: 10px 20px;
            border: 2px solid var(--mdk-green);
            border-radius: 4px;
            width: 300px;
            outline: none;
            font-family: 'Open Sans', sans-serif;
        }

        .content-padding { padding: 30px 40px; }

        /* KPI CARDS */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .kpi-card {
            background: var(--mdk-white);
            padding: 20px;
            border-radius: 2px;
            border-top: 5px solid var(--mdk-green);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .kpi-card h3 { font-size: 0.75rem; text-transform: uppercase; color: #666; }
        .kpi-card .value { font-size: 2.2rem; font-weight: 700; color: var(--mdk-green); margin-top: 5px; }

        /* MAPA ESPACIAL DE ÁREAS (TATAMIS) */
        .arena-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            padding: 40px;
            background: #e2e8f0; 
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
        }

        .tatami {
            aspect-ratio: 1; 
            background: var(--mdk-white);
            border: 6px solid;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tatami:hover {
            transform: scale(1.05);
            z-index: 2;
            box-shadow: 0 10px 20px rgba(0,104,55,0.2); 
        }

        .tatami::after {
            content: '';
            position: absolute;
            width: 70%;
            height: 70%;
            border: 2px dashed rgba(0,0,0,0.1);
            pointer-events: none;
        }

        .tatami h4 { font-size: 1.5rem; color: var(--mdk-black); font-family: 'Montserrat', sans-serif; }
        .tatami .sbn { font-size: 0.8rem; color: #666; font-weight: bold; margin: 5px 0; }
        .tatami .stats { font-size: 0.9rem; background: var(--mdk-black); color: white; padding: 4px 10px; border-radius: 12px; margin-top: 10px; z-index: 1;}

        .tatami.status-verde { border-color: var(--status-ok); }
        .tatami.status-amarillo { border-color: var(--status-warn); }
        .tatami.status-rojo { border-color: var(--status-danger); }

        @media (max-width: 1024px) { .arena-layout { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .arena-layout { grid-template-columns: 1fr; } }

        /* DRAWER */
        .drawer {
            position: fixed;
            right: -450px;
            top: 0;
            width: 450px;
            height: 100%;
            background: white;
            box-shadow: -10px 0 30px rgba(0,0,0,0.2);
            transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: 100;
            padding: 40px;
            overflow-y: auto;
        }

        .drawer.open { right: 0; }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 104, 55, 0.2);
            backdrop-filter: blur(2px);
            z-index: 90;
        }

        .overlay.active { display: block; }

        /* TABLAS Y ALERTAS */
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; }
        th { background: var(--mdk-green); color: var(--mdk-yellow); padding: 15px; text-align: left; font-family: 'Montserrat'; font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        tr:hover { background-color: #f9fff9; }

        .alert-card {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            background: white;
            border: 1px solid #eee;
            border-left: 6px solid var(--status-danger);
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="assets/logo.jpg" alt="Logo AMMDK">
            <h2>AMMDK</h2>
            <p>Asociación Mexicana MDK</p>
        </div>
        
        <nav class="sidebar-nav">
            <button class="nav-item active" onclick="showView('dashboard')">Resumen General</button>
            <button class="nav-item" onclick="showView('areas')">Mapa de Áreas</button>
            <button class="nav-item" onclick="showView('graficas')">Listado de Gráficas</button>
            <button class="nav-item" onclick="showView('alertas')">Conflictos y Alertas</button>
        </nav>
        
        <div style="padding: 20px; font-size: 0.65rem; color: #555; text-align: center; border-top: 1px solid #333; background: #000;">
            GRAFICADOR AMMDK V2.0
        </div>
    </aside>

    <div class="main-container">
        <header class="top-bar">
            <h1 id="page-title">Resumen General</h1>
            <div class="search-box">
                <input type="text" placeholder="Buscar alumno..." onkeyup="searchAlumno(this.value)">
            </div>
        </header>

        <div id="main-content" class="content-padding">
            </div>
    </div>

    <div id="overlay" class="overlay" onclick="closeDrawer()"></div>
    <div id="drawer" class="drawer">
        <button onclick="closeDrawer()" style="float:right; border:none; background:none; font-size:2rem; cursor:pointer; color:var(--mdk-green)">&times;</button>
        <div id="drawer-content" style="margin-top: 40px;"></div>
    </div>

    <script>
        window.APP_CONFIG = {
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycbz2Lz60pxRXlHqFk-E3Z8nJIfl1K5c2IkQaUyWZslQgB0YMrZ6g0B60tJOHTPzfC3_w/exec",
        };
    </script>

    <script src="assets/js/mockData.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/areas.js"></script>
    <script src="assets/js/graficas.js"></script>
    <script src="assets/js/validacion.js"></script>
    <script src="assets/js/alumnos.js"></script>

    <script>
        window.onload = async () => {
            if (typeof App !== 'undefined') {
                await App.init(); 
            }
        };

        function showView(view) {
            const btns = document.querySelectorAll('.nav-item');
            btns.forEach(b => b.classList.remove('active'));
            if(event && event.target) event.target.classList.add('active');
            if (typeof App !== 'undefined') App.renderView(view);
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }

        function searchAlumno(val) {
            if (typeof Alumnos !== 'undefined') Alumnos.buscar(val);
        }
    </script>
</body>
</html>
