<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graficador AMMDK | Panel Operativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Estilos base del proyecto AMMDK */
        :root {
            --mdk-green: #006837;
            --mdk-yellow: #f9ed32;
            --mdk-black: #1a1a1a;
            --mdk-white: #ffffff;
            --mdk-gray: #f2f2f2;
            --status-ok: #27ae60;
            --status-warn: #f39c12;
            --status-danger: #c0392b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--mdk-gray); color: var(--mdk-black); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 280px; background-color: var(--mdk-black); color: white; display: flex; flex-direction: column; z-index: 10; }
        .sidebar-header { padding: 30px 20px; text-align: center; background-color: var(--mdk-white); border-bottom: 5px solid var(--mdk-green); }
        .sidebar-header img { max-width: 160px; height: auto; display: block; margin: 0 auto 10px auto; }
        .sidebar-header h2 { font-family: 'Montserrat', sans-serif; font-size: 1.1rem; color: var(--mdk-green); font-weight: 700; }
        
        .sidebar-nav { flex: 1; padding: 20px 10px; }
        .nav-item { display: block; width: 100%; padding: 15px 20px; margin-bottom: 5px; color: #ccc; text-decoration: none; border-radius: 4px; border: none; background: transparent; text-align: left; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-transform: uppercase; transition: all 0.2s ease; }
        .nav-item.active { background-color: var(--mdk-green); color: var(--mdk-yellow); }

        .main-container { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        header.top-bar { padding: 15px 40px; background: var(--mdk-white); border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-family: 'Montserrat', sans-serif; font-size: 1.3rem; color: var(--mdk-green); text-transform: uppercase; }

        .content-padding { padding: 30px 40px; }
        
        /* Estilos de Tablas y Ranking */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th { background: var(--mdk-green); color: var(--mdk-yellow); padding: 15px; text-align: left; font-family: 'Montserrat'; font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 0.9rem; }

        .modal-juez-container { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .modal-juez-content { background: white; padding: 30px; border-radius: 4px; border-top: 5px solid var(--mdk-green); width: 90%; max-width: 500px; text-align: center; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="assets/logo.jpg" alt="Logo AMMDK">
            <h2>AMMDK</h2>
            <p style="font-size: 0.6rem; color: #666; font-weight: bold;">ASOCIACIÓN MEXICANA MDK</p>
        </div>
        <nav class="sidebar-nav">
            <button class="nav-item active" onclick="showView('dashboard')">Resumen General</button>
            <button class="nav-item" onclick="showView('areas')">Mapa de Áreas</button>
            <button class="nav-item" onclick="showView('graficas')">Listado de Gráficas</button>
            <button class="nav-item" onclick="mostrarRanking(event)" style="margin-top: 30px; color: var(--mdk-yellow); border-left: 4px solid var(--mdk-yellow);">🏆 Ranking Escuelas</button>
        </nav>
        <div style="padding: 20px; font-size: 0.65rem; color: #555; text-align: center; background: #000;">
            GRAFICADOR AMMDK | SBN SERGIO RODRIGUEZ
        </div>
    </aside>

    <div class="main-container">
        <header class="top-bar">
            <h1 id="page-title">Resumen General</h1>
        </header>
        <div id="main-content" class="content-padding"></div>
        
        <div id="vista-ranking" class="content-padding" style="display: none;">
            <h2 style="color: var(--mdk-green); font-family: 'Montserrat'; margin-bottom: 20px;">🏆 Campeonato por Escuelas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Posición</th>
                        <th>Escuela / Doyang</th>
                        <th style="text-align: center;">🥇 Oros</th>
                        <th style="text-align: center;">🥈 Platas</th>
                        <th style="text-align: center;">🥉 Bronces</th>
                        <th style="text-align: right;">Total Puntos</th>
                    </tr>
                </thead>
                <tbody id="tabla-ranking-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        window.APP_CONFIG = {
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycby8qJjsSir7OtawmfjJRipPLxueTSHa9XRXhWbGGk2nqe-tOm8GhYnrLhGFfZ-w7-__/exec",
        };
    </script>

    <script src="assets/js/api.js?v=4"></script>
    <script src="assets/js/app.js?v=4"></script>
    <script src="assets/js/areas.js?v=4"></script>
    <script src="assets/js/graficas.js?v=4"></script>
    <script src="assets/js/jueces.js?v=4"></script>

    <script>
        window.onload = async () => { if (typeof App !== 'undefined') await App.init(); };

        function showView(view) {
            document.getElementById('vista-ranking').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('page-title').innerText = view.toUpperCase();
            if (typeof App !== 'undefined') App.renderView(view);
        }

        async function mostrarRanking(e) {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('vista-ranking').style.display = 'block';
            document.getElementById('page-title').innerText = "RANKING POR ESCUELAS";
            
            const ranking = await API.getRanking();
            const tbody = document.getElementById('tabla-ranking-body');
            tbody.innerHTML = ranking.map((r, i) => `
                <tr>
                    <td><strong>#${i + 1}</strong></td>
                    <td style="font-weight: bold; color: var(--mdk-green);">${r.escuela}</td>
                    <td style="text-align: center;">${r.oros}</td>
                    <td style="text-align: center;">${r.platas}</td>
                    <td style="text-align: center;">${r.bronces}</td>
                    <td style="text-align: right; font-weight: bold;">${r.puntos_totales} pts</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
