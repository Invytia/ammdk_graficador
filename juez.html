<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel de Juez | AMMDK</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* ESTILOS PROFESIONALES AMMDK */
        :root {
            --mdk-green: #006837;
            --mdk-yellow: #f9ed32;
            --mdk-black: #1a1a1a;
            --mdk-white: #ffffff;
            --mdk-gray: #f2f2f2;
            --status-danger: #c0392b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Open Sans', sans-serif; }
        body { background-color: var(--mdk-gray); color: var(--mdk-black); padding-bottom: 50px; }

        header {
            background-color: var(--mdk-green);
            color: var(--mdk-white);
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid var(--mdk-yellow);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 { font-family: 'Montserrat', sans-serif; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px; }
        header p { font-size: 0.8rem; color: var(--mdk-yellow); font-weight: bold; margin-top: 5px; }

        .container { padding: 20px; max-width: 800px; margin: 0 auto; }

        /* PANTALLA SELECTOR DE ÁREA */
        #pantalla-areas { text-align: center; }
        .area-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .btn-area {
            background-color: var(--mdk-white);
            border: 3px solid var(--mdk-green);
            border-radius: 8px;
            padding: 30px 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--mdk-green);
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn-area:active { transform: scale(0.95); background-color: var(--mdk-green); color: var(--mdk-yellow); }

        /* LISTADO DE GRÁFICAS */
        #pantalla-combates { display: none; }
        .btn-volver {
            background: transparent; border: none; color: var(--mdk-green); font-weight: bold; font-size: 1rem;
            margin-bottom: 20px; cursor: pointer; display: flex; align-items: center;
        }
        .btn-volver::before { content: '← '; }

        .tarjeta-grafica {
            background: white; border-radius: 8px; padding: 20px; margin-bottom: 15px;
            border-left: 8px solid var(--mdk-green);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; gap: 10px;
        }
        .tarjeta-grafica.poomsae { border-left-color: #2980b9; }
        .tarjeta-grafica.kyorugui { border-left-color: #c0392b; }

        .badge-mod { padding: 5px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; color: white; text-transform: uppercase; }
        .bg-poomsae { background-color: #2980b9; }
        .bg-kyorugui { background-color: #c0392b; }

        .tg-body h3 { font-family: 'Montserrat', sans-serif; font-size: 1.1rem; margin-bottom: 5px; }
        .tg-competidores { margin-top: 10px; padding: 12px; background: #f8f9fa; border-radius: 4px; font-weight: bold; text-align: center; font-size: 1rem; }

        .btn-calificar {
            background-color: var(--mdk-green); color: var(--mdk-yellow); border: none;
            padding: 15px; border-radius: 4px; font-size: 1.1rem; font-weight: bold;
            text-transform: uppercase; cursor: pointer; width: 100%; margin-top: 10px;
        }

        /* MODAL TOUCH OPTIMIZED */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; border-top: 8px solid var(--mdk-green); }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 1.1rem; outline: none; background: #fff; }

        .btn-guardar { background-color: var(--mdk-green); color: white; border: none; padding: 18px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; }
        .btn-cancelar { background: none; color: var(--status-danger); border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; text-decoration: underline; }

        #loader { text-align: center; padding: 50px; display: none; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--mdk-green); animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <h1>Panel de Juez</h1>
        <p>Asociación Mexicana MDK</p>
    </header>

    <div class="container">
        
        <div id="pantalla-areas">
            <h2 style="font-family: 'Montserrat'; color: var(--mdk-green); margin-bottom: 10px;">Selecciona tu Área</h2>
            <div class="area-grid">
                <button class="btn-area" onclick="seleccionarArea(1)">Área 1</button>
                <button class="btn-area" onclick="seleccionarArea(2)">Área 2</button>
                <button class="btn-area" onclick="seleccionarArea(3)">Área 3</button>
                <button class="btn-area" onclick="seleccionarArea(4)">Área 4</button>
                <button class="btn-area" onclick="seleccionarArea(5)">Área 5</button>
                <button class="btn-area" onclick="seleccionarArea(6)">Área 6</button>
                <button class="btn-area" onclick="seleccionarArea(7)">Área 7</button>
                <button class="btn-area" onclick="seleccionarArea(8)">Área 8</button>
            </div>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            <p>Sincronizando con mesa de control...</p>
        </div>

        <div id="pantalla-combates">
            <button class="btn-volver" onclick="volverAreas()">Cambiar Área</button>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 id="titulo-area" style="font-family: 'Montserrat'; color: var(--mdk-green);">Área</h2>
                <span id="contador-pendientes" style="background: var(--mdk-yellow); color: var(--mdk-green); padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem;">0 Pendientes</span>
            </div>
            <div id="lista-graficas"></div>
        </div>

    </div>

    <div id="modal-juez" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-bottom: 15px;">🏆 Calificar</h2>
            <p id="modal-info" style="text-align: center; font-weight: bold; color: #666; margin-bottom: 20px; font-size: 0.9rem;"></p>
            
            <div class="form-group">
                <label>🥇 1er Lugar (Oro):</label>
                <select id="select-oro"></select>
            </div>
            <div class="form-group">
                <label>🥈 2do Lugar (Plata):</label>
                <select id="select-plata"></select>
            </div>
            <div class="form-group">
                <label>🥉 3er Lugar (Bronce 1):</label>
                <select id="select-bronce1"></select>
            </div>
            <div class="form-group">
                <label>🥉 3er Lugar (Bronce 2):</label>
                <select id="select-bronce2"></select>
            </div>

            <button onclick="enviarResultados()" id="btn-submit" class="btn-guardar">Guardar Resultados</button>
            <button onclick="cerrarModal()" class="btn-cancelar">Cancelar</button>
        </div>
    </div>

    <script>
        window.APP_CONFIG = {
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycby8qJjsSir7OtawmfjJRipPLxueTSHa9XRXhWbGGk2nqe-tOm8GhYnrLhGFfZ-w7-__/exec",
        };
    </script>

    <script src="assets/js/api.js?v=5"></script>

    <script>
        let todasLasGraficas = [];
        let areaActual = null;
        let graficaActiva = null;

        async function seleccionarArea(num) {
            areaActual = num;
            document.getElementById('pantalla-areas').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('titulo-area').innerText = `Área ${num}`;

            try {
                todasLasGraficas = await API.getGraficas() || [];
                renderizar();
            } catch (e) {
                alert("Error de conexión");
                volverAreas();
            }
        }

        function volverAreas() {
            document.getElementById('pantalla-combates').style.display = 'none';
            document.getElementById('pantalla-areas').style.display = 'block';
        }

        function renderizar() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('pantalla-combates').style.display = 'block';
            const contenedor = document.getElementById('lista-graficas');
            
            const pends = todasLasGraficas.filter(g => 
                String(g.area) === String(areaActual) && String(g.estado).toUpperCase() !== 'FINALIZADA'
            );

            document.getElementById('contador-pendientes').innerText = `${pends.length} Pendientes`;

            if (pends.length === 0) {
                contenedor.innerHTML = '<div style="text-align:center; padding: 40px; color:#999;">🎉 No hay pendientes en esta área.</div>';
                return;
            }

            contenedor.innerHTML = pends.map(g => {
                const esFormas = String(g.modalidad).toUpperCase().includes('FORMA');
                const badge = esFormas ? 'bg-poomsae' : 'bg-kyorugui';
                const card = esFormas ? 'poomsae' : 'kyorugui';
                const modTxt = esFormas ? '🥋 POOMSAE' : '🥊 KYORUGUI';
                const nombres = (g.competidores_data || []).map(c => c.nombre).join(' <span style="color:red">vs</span> ');

                return `
                    <div class="tarjeta-grafica ${card}">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <small style="color:#999; font-weight:bold;">ID: ${g.id}</small>
                            <span class="badge-mod ${badge}">${modTxt}</span>
                        </div>
                        <div class="tg-body">
                            <h3>${g.categoria || 'Categoría MDK'}</h3>
                            <p style="color:#666; font-size:0.85rem;">${g.cinta || ''}</p>
                            <div class="tg-competidores">${nombres}</div>
                        </div>
                        <button class="btn-calificar" onclick="abrirModal('${g.id}')">🎖️ Calificar</button>
                    </div>
                `;
            }).join('');
        }

        function abrirModal(id) {
            graficaActiva = todasLasGraficas.find(g => g.id === id);
            if (!graficaActiva) return;

            document.getElementById('modal-info').innerText = `${graficaActiva.categoria}`;
            
            const selects = ['oro', 'plata', 'bronce1', 'bronce2'];
            const comps = graficaActiva.competidores_data || [];

            selects.forEach(sId => {
                const el = document.getElementById(`select-${sId}`);
                el.innerHTML = '<option value="">-- Seleccionar --</option>' + 
                    comps.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
            });

            document.getElementById('modal-juez').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modal-juez').style.display = 'none';
        }

        async function enviarResultados() {
            const oro = document.getElementById('select-oro').value;
            if (!oro) return alert("Selecciona al menos el Oro.");

            const btn = document.getElementById('btn-submit');
            btn.innerText = "Sincronizando...";
            btn.disabled = true;

            const res = await API.registrarResultado(graficaActiva.id, {
                oro: oro,
                plata: document.getElementById('select-plata').value,
                bronce1: document.getElementById('select-bronce1').value,
                bronce2: document.getElementById('select-bronce2').value
            });

            if (res && res.ok) {
                graficaActiva.estado = 'FINALIZADA';
                cerrarModal();
                renderizar();
            } else {
                alert("Error al guardar");
            }
            btn.innerText = "Guardar Resultados";
            btn.disabled = false;
        }
    </script>
</body>
</html>
